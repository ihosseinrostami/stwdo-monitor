name: STWDO Dormitory Monitor

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 lxml

      - name: Run monitor
        env:
          EMAIL_ADDRESS:      ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          NTFY_TOPIC:         ${{ secrets.NTFY_TOPIC }}
        run: python monitor_cloud.py

      - name: Save state back to repo
        run: |
          git config user.name  "STWDO Monitor Bot"
          git config user.email "monitor-bot@users.noreply.github.com"
          git add state/
          git diff --staged --quiet || (git commit -m "chore: update monitor state" && git pull --rebase && git push)
